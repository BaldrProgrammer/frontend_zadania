<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Tatuaże</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>
  <header>
    <img src="img/logo.png" height="300" alt="salon">
  </header>
  <header>
    <h1>Studio Tatuażu</h1>
  </header>
  <aside>
    <h3>Dodaj wzór</h3>
    <label for="wzorI">Wzór:</label>
    <input id="wzorI" type="file" accept=".png">
    <label for="kolorS">Wzór:</label>
    <select id="kolorS">
      <option>Czerwony</option>
      <option>Czarny</option>
      <option>Zielony</option>
      <option>Niebieski</option>
    </select>
    <label for="cenaI">Wzór:</label>
    <input id="cenaI" type="number" accept=".png">
    <button id="submit" type="button">Dodaj Wzór</button>
  </aside>
  <section>
    <h2>Galeria</h2>
    <img class="miniatury" src="img/smok.png" alt="smok.png">
    <img class="miniatury" src="img/koliber.png" alt="koliber.png">
  </section>
  <footer>
    <p>autor strony: 000000000</p>
  </footer>
</body>
